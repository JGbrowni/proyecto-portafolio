<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Landing animada Sozoria</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<!-- Tus estilos -->
<link rel="stylesheet" href="styles/landing.css">
<link rel="preload" href="styles/landing.css" as="style">
</head>
<body>

<!-- Contenedor de nubes -->
<div class="clouds-container clouds-moving" id="clouds">
  <img src="../imgs/nube1.webp" class="cloud cloud1" alt="Nube 1">
  <img src="../imgs/nube2.webp" class="cloud cloud2" alt="Nube 2">
  <img src="../imgs/nube3.webp" class="cloud cloud3" alt="Nube 3">
  <img src="../imgs/nube1.webp" class="cloud cloud4" alt="Nube 4">
</div>

<!-- Imagen de fondo -->
<div class="landing-bg" id="landingBg"></div>

<!-- Contenido -->
<div class="content text-center" id="content">
  <div class="container1">
    <div class="row justify-content-center">
      <div class="col-12">
        
        <!-- Título animado (solo en pantallas grandes) -->
        <div class="title-animated d-none d-lg-flex justify-content-center" id="sozoria">
          <span class="letter">S</span>
          <span class="letter">O</span>
          <span class="letter">Z</span>
          <span class="letter">O</span>
          <span class="letter">R</span>
          <span class="letter">I</span>
          <span class="letter">A</span>
        </div>

        <!-- Título estático (solo en móviles/tablets) -->
        <h1 class="title-static d-block d-lg-none">SOZORIA</h1>

      </div>
      <div class="col-12 mt-4" id="botonComenzar">
        <button class="btn btn-lg" id="btnComenzar">Comenzar</button>
      </div>
    </div>
  </div>
</div>

<!-- Nueva sección que se mostrará después -->
<div class="next-section" id="nextSection" style="display:none;">
  <div class="hero1">
    <div class="seccion_titulo">
      <h2>SELECCIONA LA CIUDAD QUE DESEAS VISITAR</h2>
    </div>
<div class="container secciones">
        <div class="row">

            <div class="seccion col-12 col-md-6 col-xl-3 d-flex justify-content-center align-items-center h-100">
                <div class="cardd">
                    <div class="card__side card__side--front card__side--front-1">
                      <div class="card__description card1">
                        <img src="imgs/fancy.png" alt="">
                      </div>
                    </div>
                    <div class="card__side card__side--back card__side--back-1">
                      <div class="card__description card2">
                        <img src="imgs/ficon.png" alt="">
                      </div>
                    </div>
                </div>
            </div>
            
            <div class="seccion col-12 col-md-6 col-xl-3 d-flex justify-content-center align-items-center h-100">
                <div class="cardd">
                    <div class="card__side card__side--front card__side--front-1">
                      <div class="card__description card1">
                        <img src="imgs/brown.png" alt="">
                      </div>
                    </div>
                    <div class="card__side card__side--back card__side--back-1">
                      <div class="card__description card2">
                        <img src="imgs/bicon.png" alt="">
                      </div>
                    </div>
                </div>
            </div>

            <div class="seccion col-12 col-md-6 col-xl-3 d-flex justify-content-center align-items-center h-100">
                <div class="cardd">
                    <div class="card__side card__side--front card__side--front-1">
                      <div class="card__description card1">
                        <img src="imgs/skatlet.png" alt="">
                      </div>
                    </div>
                    <div class="card__side card__side--back card__side--back-1">
                      <div class="card__description card2">
                        <img src="imgs/sicon.png" alt="">
                      </div>
                    </div>
                </div>
            </div>

            <div class="seccion col-12 col-md-6 col-xl-3 d-flex justify-content-center align-items-center h-100">
                <div class="cardd">
                    <div class="card__side card__side--front card__side--front-1">
                      <div class="card__description card1">
                        <img src="imgs/madelina.png" alt="">
                      </div>
                    </div>
                    <div class="card__side card__side--back card__side--back-1">
                      <div class="card__description card2">
                        <img src="imgs/micon.png" alt="">
                      </div>
                    </div>
                </div>
            </div>

        </div>
       </div>
    </div>
  </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Tu JS -->
<script src="js/landing.js"></script>
</body>
</html>
