<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivos de Sozoria</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<!-- Estilos -->
<link rel="stylesheet" href="../sozoriArchivos/archivos.css">
<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
<div class="orientation-overlay" id="orientationOverlay">
        <div class="device-icon">
            <div class="phone-container">
                <div class="phone"></div>
            </div>
        </div>
        
        <div class="orientation-message pulse">
            Para tener una mejor experiencia es recomendable verla en vertical por el dispositivo en que se encuentra.
        </div>
        
        <div class="rotate-indicator">
            Gira tu dispositivo
            <span class="arrow-rotate">↻</span>
        </div>
  </div>

<div class="container-fluid menu">
    <!-- Botón de regreso al inicio con temática espacial -->
    <button class="back-button" id="backButton" aria-label="Regresar al inicio de Sozoria">
        <i class="fa fa-rocket" aria-hidden="true"></i>
    </button>

    <!-- Lightbox de confirmación -->
    <div class="confirm-lightbox" id="confirmLightbox" aria-hidden="true">
        <div class="confirm-card">
            <h2>¿Estás seguro de regresar?</h2>
            <p>Serás llevado a la página principal de Sozoria.</p>
            <div class="confirm-actions">
                <button class="btn btn-danger" id="confirmYes">Sí, regresar</button>
                <button class="btn btn-secondary" id="confirmNo">No, quedarme</button>
            </div>
        </div>
        <div class="space-animation"></div>
    </div>
</div>

<div class="desktop-design">
<div class="bg-animation">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
        <div id="stars4"></div>
    </div>
</div>

<!-- Footer -->
<footer class="footer-sozoria">
    <div class="footer-content">
        <div class="footer-left">
      <p>&copy; 2025 - <span id="current-year">2026</span> Osobrowni &amp; Browni. Marca, personajes y contenidos creados por Oscar Flores</p>
    </div>
        <div class="footer-right">
            <a href="https://instagram.com/osobrowni" target="_blank" aria-label="Instagram"><i class="fa fa-instagram"></i></a>
            <a href="https://x.com/osobrowni" target="_blank" aria-label="X"><i class="fa fa-twitter"></i></a>
            <a href="https://www.youtube.com/@Osobrowni" target="_blank" aria-label="YouTube"><i class="fa fa-youtube-play"></i></a>
            <a href="https://www.behance.net/browni_designer" target="_blank" aria-label="Behance"><i class="fa fa-behance"></i></a>
        </div>
    </div>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../sozoriArchivos/archivos.js"></script>
</body>
</html>
